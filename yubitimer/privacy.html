<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゆびタイマー プライバシーポリシー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Murecho:wght@300;400&display=swap">
<style>
  :root { --bg: #07070b; --fg: #f4f4f8; --mute: #8b8b99; --line: rgba(255,255,255,.08); }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 300 16px/1.9 Murecho, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 4rem 1.25rem; }
  h1 { font-weight: 400; font-size: 1.5rem; margin: 0 0 2rem; }
  h2 { font-weight: 400; font-size: 1.05rem; margin: 2.5rem 0 .5rem; padding-top: 1.5rem; border-top: 1px solid var(--line); }
  p { margin: 0 0 1rem; }
  small { color: var(--mute); }
</style>
</head>
<body>
<main>
  <h1>ゆびタイマー プライバシーポリシー</h1>
  <h2>集める情報</h2>
  <p>ゆびタイマーは、個人を特定する情報も、利用状況の情報も集めません。広告や解析のための仕組みも組み込んでいません。</p>
  <h2>記録の保存先</h2>
  <p>計測した記録と設定は、お使いの iPhone の中だけに保存されます。開発者を含め、外部に送られることはありません。アプリを削除すると記録も消えます。</p>
  <h2>お問い合わせ</h2>
  <p>App Store のアプリのページにある「Appサポート」からご連絡ください。</p>
  <p><small>2026年10月12日 制定</small></p>
</main>
</body>
</html>
